# 叠加层示例：`python run.py --patch` 时应用
#
# 1) 换上真实模型适配器（需要设置 DEEPSEEK_API_KEY）
# 2) 放行危险工具（approval 的 allow_dangerous 改为 true）
# 3) 关闭遥测
#
# 注意：patch 按 id 定位条目并**替换其整个 config**。

- id: llm
  config:
    provider: deepseek
    model: deepseek-chat
    max_tokens: 2048

- insert:
    - id: llm-deepseek
      name: ./plugins/llm_openai.py
      config:
        base_url: https://api.deepseek.com
        api_key_env: DEEPSEEK_API_KEY

- id: approval
  config:
    allow_dangerous: true
    forbid: ['rm -rf /']

- id: telemetry
  disabled: true
